name: hooper
description: "A new way to find people to play basketball with"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.7.1
  cloud_functions: ^6.3.5
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  firebase_messaging: ^16.5.0
  firebase_storage: ^13.4.6
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.3.2
  geolocator: ^14.0.2
  google_fonts: ^8.2.1
  google_maps_flutter: ^2.18.0
  google_sign_in: ^7.2.0
  grain: ^0.0.1
  image_picker: ^1.2.1
  intl: ^0.20.3
  map_launcher: ^6.0.0
  progressive_blur: ^0.0.2
  screen_corner_radius: ^3.0.0
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/map_style.json
    - assets/google_sans_flex.ttf

linter:
  rules:
    - use_declaring_parameters
